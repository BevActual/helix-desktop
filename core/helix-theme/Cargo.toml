[package]
name = "helix-theme"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Palette math and custom-palette storage. Ports src/theme/ (C++ ThemeService) with output parity."

[dependencies]
image = { workspace = true, features = ["png", "jpeg", "gif", "bmp", "webp"] }
libc = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
toml = { workspace = true }
material-colors = { path = "../../third_party/material-colors", default-features = false, features = ["std", "quantize"] }

[[bin]]
name = "gen-golden-template"
path = "src/bin/gen_golden_template.rs"

[lints]
workspace = true
