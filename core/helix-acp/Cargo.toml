[package]
name = "helix-acp"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "A client for the Agent Client Protocol: drives a coding agent as a subprocess over newline-framed JSON-RPC, and hands the agent's file, terminal and permission requests to the host."

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
