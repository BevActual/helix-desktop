[package]
name = "helix-compositor"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "What the shell knows about the compositor: its config and IPC, window facts, capture, and the agent desk."

[dependencies]
helix-base = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
