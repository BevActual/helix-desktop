[package]
name = "helix-shell-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pure Helix shell logic. No Tauri, GTK, or D-Bus."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ts-rs = { version = "10", optional = true }

[features]
# Generates TypeScript types for the views the React apps receive: tools/gen-bindings.sh
ts = ["dep:ts-rs"]
