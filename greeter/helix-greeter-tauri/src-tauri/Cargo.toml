[package]
name = "helix-greeter"
version = "0.1.0"
edition = "2021"
publish = false
description = "Helix login greeter (greetd). Tauri face; appearance sync matches the session shell."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }

[[bin]]
name = "helix-greeter"
path = "src/main.rs"
