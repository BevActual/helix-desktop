# Rust side of Helix. The C++ shell keeps running until each surface here reaches parity.
[workspace]
resolver = "2"
members = [
    "helix-shell-core",
    "helix-desktop-api",
    "helix-wallpaper",
    "helix-idle",
    "helix-shell-tauri/src-tauri",
    "helix-settings/src-tauri",
    "helix-attacker",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# For iterating on the live desktop: links in seconds instead of minutes. Memory is measured with the release profile.
[profile.fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = false
