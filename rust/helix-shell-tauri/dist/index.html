<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; }
  #bar { height: 34px; box-sizing: border-box; margin: 4px 12px 0; padding: 0 14px; display: flex; align-items: center;
         justify-content: space-between; background: var(--bg); border-radius: 18px; }
  #live { font-weight: 600; }
  /* Covers everything below the bar while a panel is open, so a click outside the panel lands here and dismisses it. */
  #scrim { position: fixed; inset: 42px 0 0 0; display: none; }
  #panel { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); width: 520px; box-sizing: border-box; padding: 16px;
           background: var(--bg); border-radius: 14px; display: none; flex-direction: column; gap: 12px; }
  body.open #scrim { display: block; } body.open #panel { display: flex; }
  h3 { margin: 0; color: var(--accent); }
  input { font: inherit; color: var(--fg); background: rgba(0,0,0,.35); border: 2px solid var(--accent); border-radius: 8px; padding: 8px 10px; user-select: text; }
  #body { min-height: 1.4em; } #reason, #note { color: var(--mut); font-size: 12px; }
  #buttons { display: none; justify-content: flex-end; gap: 8px; }
</style>
<div id="bar"><span id="live">Sound …</span><span><button id="ask">Assistant</button></span></div>
<div id="scrim"></div>
<div id="panel"><h3>Assistant</h3><input id="q" placeholder="What should I do?">
  <div id="body"></div><div id="reason"></div><div id="note"></div>
  <div id="buttons"><button id="cancel">Cancel</button><button id="doit" class="primary" disabled>Do it</button></div></div>
<script src="shell.js"></script>
