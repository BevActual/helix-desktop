<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<div id="bar">
  <div class="side">
    <button class="bar-btn icon" id="apps" data-test="apps" title="Apps"><i data-icon="grid"></i></button>
    <button class="bar-btn icon" id="ask" data-test="ask" title="Assistant"><i data-icon="sparkle"></i></button>
    <div id="workspaces" data-test="workspaces"></div>
  </div>
  <button class="bar-btn" id="clock" data-test="clock" title="Notifications"><span class="day"></span><span class="time"></span></button>
  <div class="side right">
    <div id="tray" data-test="tray"></div>
    <button class="bar-btn icon" id="agentsbtn" data-test="agentsbtn" style="display:none" title="Agents"><i data-icon="shield"></i></button>
    <button class="bar-btn icon" id="notifbtn" data-test="notifbtn" title="Notifications"><i data-icon="bell" data-slot="bell"></i><span class="badge" id="notif-badge" hidden></span></button>
    <button class="bar-btn" id="controlbtn" data-test="controlbtn" title="Control Center">
      <span id="status"><i data-icon="wifi" data-slot="wifi"></i><i data-icon="bluetooth" data-slot="bt"></i><i data-icon="volume" data-slot="vol"></i><span id="batt"><i data-icon="battery" data-slot="batt"></i><span id="batt-label"></span></span></span>
    </button>
  </div>
  <span id="live" hidden></span>
</div>
<div id="scrim"></div>
<div id="controls" class="panel glass">
  <div id="qs-main">
    <div id="qs-head"><div><div id="qs-time" data-test="time"></div><div id="qs-date"></div></div><div id="qs-battery" data-test="battery"></div></div>
    <div id="tiles">
      <div class="tile" id="tile-wifi" data-test="tile-wifi"><span class="tile-ico"><i data-icon="wifi"></i></span><div class="tile-main"><div class="tile-title">Internet</div><div class="tile-sub" id="tile-wifi-sub"></div></div><button class="tile-open" id="tile-wifi-open" data-test="tile-wifi-open" title="Wi-Fi details"><i data-icon="chevron-right"></i></button></div>
      <div class="tile" id="tile-bt" data-test="tile-bt"><span class="tile-ico"><i data-icon="bluetooth"></i></span><div class="tile-main"><div class="tile-title">Bluetooth</div><div class="tile-sub" id="tile-bt-sub"></div></div><button class="tile-open" id="tile-bt-open" data-test="tile-bt-open" title="Bluetooth details"><i data-icon="chevron-right"></i></button></div>
      <div class="tile" id="tile-dark" data-test="tile-dark"><span class="tile-ico"><i data-icon="contrast"></i></span><div class="tile-main"><div class="tile-title">Dark theme</div><div class="tile-sub" id="tile-dark-sub"></div></div></div>
      <div class="tile" id="tile-dnd" data-test="tile-dnd"><span class="tile-ico"><i data-icon="moon"></i></span><div class="tile-main"><div class="tile-title">Do not disturb</div><div class="tile-sub" id="tile-dnd-sub"></div></div></div>
      <div class="tile" id="tile-night" data-test="tile-night"><span class="tile-ico"><i data-icon="sun"></i></span><div class="tile-main"><div class="tile-title">Night Light</div><div class="tile-sub" id="tile-night-sub"></div></div></div>
    </div>
    <div class="sliderrow" id="brightrow" style="display:none">
      <span id="bright-ico"><i data-icon="sun"></i></span>
      <div id="brightslider"><div id="brightfill"></div><input id="brightness" data-test="brightness" type="range" min="0" max="100" step="1" value="0"></div>
      <span id="bright-percent"></span>
    </div>
    <div id="audio-note"></div>
    <div class="sliderrow" id="volrow">
      <button id="mute" data-test="mute" title="Mute"><i data-icon="volume" data-slot="mute"></i></button>
      <div id="volslider"><div id="volfill"></div><input id="volume" data-test="volume" type="range" min="0" max="100" step="1" value="0"></div>
      <span id="percent"></span>
      <button class="tile-open" id="sound-open" data-test="sound-open" title="Sound output"><i data-icon="chevron-right"></i></button>
    </div>
  </div>
  <div id="qs-detail" style="display:none">
    <div id="detail-head"><button id="back" data-test="back" title="Back"><i data-icon="chevron-left"></i></button><h3 id="detail-title"></h3></div>
    <div class="page" id="detail-sound"><div id="outputdev"></div><div id="outputs"></div></div>
    <div class="page" id="wifi">
      <div id="wifi-head"><button id="scan" data-test="wifi-scan">Scan</button><button id="disconnect" data-test="wifi-disconnect">Disconnect</button><button id="wifitoggle" data-test="wifi-toggle">Turn off</button></div>
      <div id="wifi-status"></div>
      <div id="networks"></div>
      <div id="vpns"></div>
    </div>
    <div class="page" id="bluetooth">
      <div id="bt-head"><button id="btscan" data-test="bt-scan">Scan</button><button id="bttoggle" data-test="bt-toggle">Turn off</button></div>
      <div id="bt-status"></div>
      <div id="btdevices"></div>
    </div>
  </div>
</div>
<div id="dock-edge" data-test="dock-edge"></div>
<div id="dock" class="glass" data-test="dock"><div id="dock-items"></div></div>
<div id="dock-tip"></div>
<div id="dock-menu" class="glass"></div>
<div id="tray-menu" class="glass"></div>
<div id="toasts"></div>
<div id="osd"><i data-icon="volume" data-slot="osd-ico"></i><div id="osd-bar"><div id="osd-fill"></div></div><span id="osd-val"></span><span id="osd-text"></span></div>
<div id="notifs" class="panel glass">
  <div id="notif-head"><h3>Notifications</h3><button id="notif-dnd" data-test="notif-dnd">Do not disturb</button><button id="notif-clear" data-test="notif-clear">Clear all</button></div>
  <div id="notif-list"></div><div id="notif-empty"></div>
</div>
<div id="agents" class="panel glass">
  <div id="agent-head"><h3>Agents</h3><button id="agent-stopall" data-test="agent-stopall">Stop all</button><button id="agent-toggle" data-test="agent-toggle">Turn off</button></div>
  <div id="agent-state"></div>
  <h4>Waiting for you</h4><div id="agent-pending"></div>
  <h4>Access</h4><div id="agent-grants"></div>
  <h4>Recent</h4><div id="agent-history"></div>
</div>
<div id="quickinsert" class="panel glass">
  <div id="qi-field"><i data-icon="search"></i><input id="qi-input" placeholder="Search emoji, clipboard and actions" autocomplete="off"></div>
  <div id="qi-tabs" role="tablist">
    <button class="qi-tab" id="qi-tab-emoji" data-test="qi-tab-emoji" data-source="emoji">Emoji</button>
    <button class="qi-tab" id="qi-tab-clipboard" data-test="qi-tab-clipboard" data-source="clipboard">Clipboard</button>
    <button class="qi-tab" id="qi-tab-actions" data-test="qi-tab-actions" data-source="actions">Actions</button>
    <span id="qi-spacer"></span>
    <button id="qi-forget" data-test="qi-forget" title="Forget everything copied so far">Clear history</button>
  </div>
  <div id="qi-results"></div>
  <div id="qi-empty"></div>
  <div id="qi-hint"><span>↵ insert</span><span>⇥ switch</span><span>esc close</span></div>
</div>
<div id="launcher" class="panel glass"><input id="lq" placeholder="Search applications" autocomplete="off"><div id="results"></div><div id="empty"></div></div>
<div id="panel" class="panel glass"><div id="panel-head"><i data-icon="sparkle"></i><h3>Assistant</h3></div><input id="q" placeholder="What should I do?" autocomplete="off">
  <div id="body"></div><div id="reason"></div><div id="note"></div>
  <div id="buttons"><button id="cancel">Cancel</button><button id="doit" class="primary" disabled>Do it</button></div></div>
<script src="icons.js"></script>
<script src="shell.js"></script>
