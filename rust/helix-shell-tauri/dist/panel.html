<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  #card { margin: 8px; padding: 16px; background: var(--bg); border-radius: 14px; display: flex; flex-direction: column; gap: 12px; }
  h3 { margin: 0; color: var(--accent); }
  input { font: inherit; color: var(--fg); background: rgba(0,0,0,.35); border: 2px solid var(--accent); border-radius: 8px; padding: 8px 10px; user-select: text; }
  #body { min-height: 1.4em; white-space: pre-wrap; } #reason { color: var(--mut); font-size: 12px; }
  #buttons { display: none; justify-content: flex-end; gap: 8px; }
</style>
<div id="card"><h3>Assistant</h3><input id="q" placeholder="What should I do?" autofocus>
  <div id="body"></div><div id="reason"></div>
  <div id="buttons"><button id="cancel">Cancel</button><button id="doit" class="primary" disabled>Do it</button></div></div>
<script>
  // Same flow as the native panel: helix-assistant --json plans, a person confirms, --execute runs exactly what was shown.
  // Everything shown comes from a model or the desktop, so it is only ever set as text, never as markup.
  const { invoke } = window.__TAURI__.core;
  const $ = (id) => document.getElementById(id);
  let plan = null, request = "", busy = false, shownAt = 0;
  const show = (body, reason = "", confirm = false) => { $("body").textContent = body; $("reason").textContent = reason;
    $("buttons").style.display = confirm ? "flex" : "none"; $("doit").disabled = true;
    if (confirm) { shownAt = performance.now(); setTimeout(() => ($("doit").disabled = false), 700); } };
  const run = async (args) => { try { return JSON.parse(await invoke("assistant", { args })); } catch (e) { return { kind: "error", text: "The assistant did not give an answer." }; } };
  $("q").addEventListener("keydown", async (e) => {
    if (e.key !== "Enter" || busy || plan) return;            // Enter submits a request; it never confirms a change
    request = $("q").value.trim(); if (!request) return;
    busy = true; $("q").value = ""; show("Thinking…");
    const r = await run(["--json", request]); busy = false;
    if (r.kind === "confirm") { plan = r; show("About to: " + r.description, r.reason ? "The assistant says: “" + r.reason + "”" : "", true); }
    else show(r.text || "Done.");
  });
  $("cancel").onclick = () => { plan = null; show(""); };
  $("doit").onclick = async () => {
    if (!plan || performance.now() - shownAt < 700) return;
    const p = plan; plan = null; busy = true; show("Doing it…");
    const r = await run(["--json", "--request", request, "--execute", p.tool, ...p.args]); busy = false; show(r.text || "Done.");
  };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { plan = null; show(""); invoke("toggle_panel"); } });
  requestAnimationFrame(() => invoke("ready"));
</script>
