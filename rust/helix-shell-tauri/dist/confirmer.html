<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<body class="confirmer">
<div id="card" class="glass">
  <div id="head"><span id="shield"><i data-icon="shield"></i></span><div id="title" data-test="confirm-title"></div></div>
  <div id="subject" data-test="confirm-subject"></div>
  <div id="detailbox"><div id="detaillabel">Exact action</div><div id="detail" data-test="confirm-detail"></div></div>
  <div id="aside" data-test="confirm-aside"></div>
  <div id="tiers" data-test="confirm-tiers"></div>
  <div id="warning" data-test="confirm-taint">This app read private content since you last approved something.</div>
  <div id="waiting" data-test="confirm-waiting"></div>
  <div id="actions">
    <button type="button" data-test="confirm-deny" id="deny">Deny</button>
    <button type="button" data-test="confirm-allow" id="allow" class="primary" disabled><span>Allow</span></button>
  </div>
</div>
<script src="icons.js"></script>
<script src="confirmer.js"></script>
