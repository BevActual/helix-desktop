[package]
name = "helix-shell-tauri"
version = "0.1.0"
edition = "2021"
publish = false
description = "Helix shell surfaces on Tauri. A thin face over helix-shell-core and helix-desktop-api."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
helix-desktop-api = { path = "../../helix-desktop-api" }
helix-shell-core = { path = "../../helix-shell-core" }
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri = { version = "2", features = [] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["time", "sync"] }
