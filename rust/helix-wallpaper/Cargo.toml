[package]
name = "helix-wallpaper"
version = "0.1.0"
edition = "2021"
publish = false
description = "Paints the desktop background on a Wayland layer surface. A separate small process, so its memory is not the shell's."

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
memmap2 = "0.9"
libc = "0.2"
toml = "0.8"
