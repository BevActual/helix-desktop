[package]
name = "helix-settings"
version = "0.1.0"
edition = "2021"
publish = false
description = "Helix Settings: its own Tauri application. The Agent1 manager (who may do what), and the pages that grow around it."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
helix-desktop-api = { path = "../../helix-desktop-api" }
helix-shell-core = { path = "../../helix-shell-core" }
helix-wallpaper = { path = "../../helix-wallpaper" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.22"
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["time", "sync"] }

[[bin]]
name = "helix-settings"
path = "src/main.rs"
