<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<body class="settings">
<div id="app">
  <aside id="side">
    <div id="titlebar" data-tauri-drag-region>
      <button id="close" class="win-btn" data-test="close" title="Close" aria-label="Close"><i data-icon="x"></i></button>
    </div>
    <nav id="pages">
      <button class="page-link current" data-page="agents" data-test="page-agents"><i data-icon="shield"></i><span>Privacy &amp; agents</span></button>
    </nav>
  </aside>
  <main id="content">
    <header data-tauri-drag-region><h2 id="page-title">Privacy &amp; agents</h2><button id="refresh" data-test="refresh" title="Read again">Refresh</button></header>
    <section id="page-agents" class="settings-page">
      <div id="agents-note"></div>
      <h4>Applications with access</h4>
      <div id="agents-clients"></div>
      <h4>Recent activity</h4>
      <div id="agents-history"></div>
    </section>
  </main>
</div>
<script src="icons.js"></script>
<script src="settings.js"></script>
