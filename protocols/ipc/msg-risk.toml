brightness-up = "act"
caffeine-disable = "act"
caffeine-enable = "act"
caffeine-toggle = "act"
color-scheme-set = "act"
config-reload = "act"
desktop-widgets-edit = "act"
desktop-widgets-exit = "act"
desktop-widgets-hide = "act"
desktop-widgets-show = "act"
desktop-widgets-toggle = "act"
desktop-widgets-toggle-edit = "act"
dock-hide = "act"
dock-reload = "act"
dock-show = "act"
dock-toggle = "act"
dpms-off = "act"
dpms-on = "act"
effects-profile-set = "act"
keyboard-backlight-down = "act"
keyboard-backlight-osd = "act"
keyboard-backlight-set = "act"
keyboard-backlight-toggle = "act"
keyboard-backlight-up = "act"
keyboard-layout-cycle = "act"
lockscreen-widgets-edit = "act"
lockscreen-widgets-exit = "act"
lockscreen-widgets-toggle-edit = "act"
log-level-set = "act"
media = "act"
mic-volume-down = "act"
mic-volume-osd = "act"
mic-volume-set = "act"
mic-volume-up = "act"
nightlight-disable = "act"
nightlight-enable = "act"
nightlight-force-toggle = "act"
