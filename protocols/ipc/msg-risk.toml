# Risk tiers for every `helix-shell msg` command. Source of truth for the agent allowlist.
# tests/msg_risk_policy_test.py fails if a command is missing here, so a new command
# cannot ship unclassified. When unsure, pick the stricter tier.
version = 1

[tiers]

# observe: Read-only state. Safe to expose to any granted client.
ai-usage-localai-endpoint = "observe"
ai-usage-status = "observe"
bluetooth-status = "observe"
brightness-list-backlight-devices = "observe"
color-scheme-get = "observe"
desktop-ai-status = "observe"
firewall-status = "observe"
log-level-status = "observe"
notification-dnd-status = "observe"
privacy-status = "observe"
printers-status = "observe"
status = "observe"
tailscale-status = "observe"
theme-mode-get = "observe"
wallpaper-get = "observe"
wifi-status = "observe"
workspace-alert-status = "observe"

# observe-private: Read-only but returns private content (screen, clipboard, notifications). Needs an explicit grant; output is untrusted data.
clipboard-text = "observe-private"
desktop-capture = "observe-private"
notification-history = "observe-private"
screenshot-fullscreen = "observe-private"
screenshot-ocr = "observe-private"
screenshot-scan-qr = "observe-private"

# act: Reversible local UI and preference changes. Allowed with the act grant.
ai-usage-localai-open = "act"
ai-usage-refresh = "act"
annotate = "act"
bar-auto-hide-set = "act"
bar-hide = "act"
bar-layer-set = "act"
bar-reserve-toggle = "act"
bar-show = "act"
bar-toggle = "act"
brightness-down = "act"
brightness-osd = "act"
brightness-set = "act"
brightness-up = "act"
caffeine-disable = "act"
caffeine-enable = "act"
caffeine-toggle = "act"
color-scheme-set = "act"
config-reload = "act"
desktop-widgets-edit = "act"
desktop-widgets-exit = "act"
desktop-widgets-hide = "act"
desktop-widgets-show = "act"
desktop-widgets-toggle = "act"
desktop-widgets-toggle-edit = "act"
dock-hide = "act"
dock-reload = "act"
dock-show = "act"
dock-toggle = "act"
dpms-off = "act"
dpms-on = "act"
effects-profile-set = "act"
keyboard-backlight-down = "act"
keyboard-backlight-osd = "act"
keyboard-backlight-set = "act"
keyboard-backlight-toggle = "act"
keyboard-backlight-up = "act"
keyboard-layout-cycle = "act"
lockscreen-widgets-edit = "act"
lockscreen-widgets-exit = "act"
lockscreen-widgets-toggle-edit = "act"
log-level-set = "act"
media = "act"
mic-volume-down = "act"
mic-volume-osd = "act"
mic-volume-set = "act"
mic-volume-up = "act"
nightlight-disable = "act"
nightlight-enable = "act"
nightlight-force-toggle = "act"
nightlight-toggle = "act"
notification-clear-active = "act"
notification-dnd-set = "act"
notification-dnd-toggle = "act"
notification-show = "act"
osd-disable = "act"
osd-enable = "act"
osd-toggle = "act"
panel-close = "act"
panel-open = "act"
panel-toggle = "act"
power-cycle = "act"
power-set = "act"
screenshot-annotate = "act"
screenshot-pick-color = "act"
screenshot-region = "act"
settings-close = "act"
settings-open = "act"
settings-open-widget = "act"
settings-toggle = "act"
taskbar-cycle = "act"
theme-mode-set = "act"
theme-mode-toggle = "act"
volume-down = "act"
volume-mute = "act"
volume-osd = "act"
volume-set = "act"
volume-up = "act"
wallpaper-next = "act"
wallpaper-previous = "act"
wallpaper-random = "act"
wallpaper-set = "act"
window-switcher = "act"
workspace-alert-add = "act"
workspace-alert-add-window = "act"
workspace-alert-clear = "act"
workspace-alert-clear-all = "act"
workspace-switch = "act"

# confirm: Changes system state, touches hardware, network, files or the clipboard, or runs other software. Needs shell-side user confirmation.
ai-usage-localai-delete = "confirm"
ai-usage-localai-install = "confirm"
ai-usage-localai-model = "confirm"
ai-usage-localai-start = "confirm"
ai-usage-localai-stop = "confirm"
ai-usage-ollama-cancel = "confirm"
ai-usage-ollama-delete = "confirm"
ai-usage-ollama-model = "confirm"
ai-usage-ollama-pull = "confirm"
ai-usage-ollama-start = "confirm"
ai-usage-ollama-stop = "confirm"
app-launch = "confirm"
bluetooth-disable = "confirm"
bluetooth-enable = "confirm"
bluetooth-toggle = "confirm"
clipboard-clear = "confirm"
clipboard-copy = "confirm"
desktop-ai-describe = "confirm"
desktop-ai-dictate = "confirm"
desktop-ai-read = "confirm"
desktop-ai-rewrite = "confirm"
desktop-ai-speak = "confirm"
desktop-ai-summarize = "confirm"
desktop-ai-translate = "confirm"
greeter-sync = "confirm"
network-toggle = "confirm"
notification-clear-history = "confirm"
notification-invoke-latest = "confirm"
printers-start = "confirm"
screen-record-replay-save = "confirm"
screen-record-replay-start = "confirm"
screen-record-replay-stop = "confirm"
screen-record-replay-toggle = "confirm"
screen-record-start = "confirm"
screen-record-stop = "confirm"
screen-record-toggle = "confirm"
tailscale-down = "confirm"
tailscale-toggle = "confirm"
tailscale-up = "confirm"
templates-apply = "confirm"
wifi-disable = "confirm"
wifi-enable = "confirm"
wifi-toggle = "confirm"
window-close = "confirm"
mic-mute = "confirm"

# blocked: Never reachable by an agent client.
firewall-panic-toggle = "blocked"
session = "blocked"

# Choice-level overrides, keyed "<command> <first-argument>". Used where one command
# spans very different risk, such as `session`. Unlisted choices keep the command tier.
[choices]
"session lock" = "act"
"session suspend" = "confirm"
"session lock-and-suspend" = "confirm"
