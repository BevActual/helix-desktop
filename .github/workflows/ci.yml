name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-progress runs for the same branch/PR when new commits land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translations:
    name: Check translation keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check English catalog references
        run: python3 tools/i18n-check.py

  format:
    name: clang-format
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed git clang

      - uses: actions/checkout@v6

      - name: Check formatting
        run: |
          mapfile -d '' files < <(find src \( -name '*.cpp' -o -name '*.h' \) -print0)
          clang-format --dry-run -Werror "${files[@]}"

  build:
    name: Build (debug)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git meson ninja pkgconf \
            wayland wayland-protocols \
            libglvnd freetype2 fontconfig noto-fonts \
            cairo pango harfbuzz \
            libxkbcommon glib2 \
            libsecret libsodium \
            sdbus-cpp libpipewire wireplumber polkit \
            pam curl libwebp libjxl libsndfile librsvg \
            libqalculate libxml2 \
            tomlplusplus libical libcups \
            nlohmann-json stb \
            jemalloc just clang

      - uses: actions/checkout@v6

      - name: Build
        run: just build

      - name: Check staged installation
        run: just test-install

      - name: Test
        run: just test debug --print-errorlogs

      # Full-tree clang-tidy with -warnings-as-errors is still catching up after the
      # C++ session binary retirement; run `just lint` locally before large C++ changes.

  helix-shell-core:
    name: helix-shell-core (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests
        run: cargo test -p helix-shell-core --lib --quiet

  helix-desktop-agent:
    name: helix-desktop Agent Surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus dbus-x11 python3-gi gir1.2-gio-2.0
      - name: Agent integration (Rust desktop)
        run: ./tools/nested/helix-desktop-agent-integration.sh

  helix-desktop-config:
    name: helix-desktop Configuration1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus dbus-x11 python3-gi gir1.2-gio-2.0
      - name: Configuration smoke (Rust desktop)
        run: ./tools/nested/helix-desktop-config-smoke.sh

  helix-desktop-audio-meter:
    name: helix-desktop Audio meter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus dbus-x11 python3-gi gir1.2-gio-2.0 pipewire wireplumber
      - name: Input meter integration (Rust desktop)
        run: ./tools/nested/helix-desktop-audio-meter-integration.sh
