name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-progress runs for the same branch/PR when new commits land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translations:
    name: Check translation keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check English catalog references
        run: python3 tools/i18n-check.py

  format:
    name: clang-format
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install tools
        run: |
          for attempt in 1 2 3; do
            pacman -Syu --noconfirm --needed git clang && break
            echo "pacman failed (attempt ${attempt}), retrying..."
            sleep 15
          done

      - uses: actions/checkout@v6

      - name: Check formatting
        run: |
          if [[ ! -d cpp ]]; then
            echo "no platform C++ sources"
            exit 0
          fi
          mapfile -d '' files < <(find cpp \( -name '*.cpp' -o -name '*.h' \) -print0)
          if ((${#files[@]} == 0)); then
            echo "no platform C++ sources"
            exit 0
          fi
          clang-format --dry-run -Werror "${files[@]}"

  build:
    name: Build (debug)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: bash tools/ci/arch-helix-ci-deps.sh

      - name: Build
        run: just build

      - name: Check staged installation
        run: just test-install

      - name: Test
        run: just test debug --print-errorlogs

      # Full-tree clang-tidy with -warnings-as-errors is still catching up after the
      # C++ session binary retirement; run `just lint` locally before large C++ changes.

  helix-shell-core:
    name: helix-shell-core (Rust)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: bash tools/ci/arch-helix-ci-deps.sh
      - name: Unit tests
        run: |
          tools/verify_config_export_golden.sh
          cargo test -p helix-shell-core --lib --quiet
      - name: helix-theme (C++ parity goldens)
        run: cargo test -p helix-theme --quiet
      - name: helix-desktop in-process theme tests
        run: cargo test -p helix-desktop in_process --quiet

  helix-desktop-agent:
    name: helix-desktop Agent Surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus dbus-x11 python3-gi gir1.2-gio-2.0 \
            libpipewire-0.3-dev libspa-0.2-dev
      - name: Agent integration (Rust desktop)
        run: ./tools/nested/helix-desktop-agent-integration.sh

  helix-desktop-config:
    name: helix-desktop Configuration1
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: bash tools/ci/arch-helix-ci-deps.sh dbus python python-gobject
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust desktop and Meson integration tests
        run: |
          cargo build --profile fast -p helix-desktop -p helix-assistant -p helix-inference
          just configure debug
      - name: Configuration smoke (Rust desktop)
        env:
          HELIX_ASSETS_DIR: ${{ github.workspace }}/assets
        run: ./tools/nested/helix-desktop-config-smoke.sh
      - name: Rust Configuration1 contract
        run: ./tools/nested/helix-desktop-configuration-contract.sh
      # The Rust assistant against the Rust service and the C++ inference service (scripted replies).
      - name: Assistant integration (Rust assistant + desktop)
        run: meson test -C build-debug --no-rebuild --print-errorlogs assistant_integration
      # inference_service_integration (~100 s) runs under `just test`/meson locally; on the CI container it was
      # SIGKILLed at ~85 s, so it is not a CI gate until that is understood. The crate is still compiled above.

  helix-desktop-audio-meter:
    name: helix-desktop Audio meter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus dbus-x11 python3-gi gir1.2-gio-2.0 pipewire wireplumber \
            libpipewire-0.3-dev libspa-0.2-dev
      - name: Input meter integration (Rust desktop)
        run: ./tools/nested/helix-desktop-audio-meter-integration.sh
