name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-progress runs for the same branch/PR when new commits land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translations:
    name: Check translation keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check English catalog references
        run: python3 tools/i18n-check.py

  build:
    name: Build (debug)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: bash tools/ci/arch-helix-ci-deps.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the services
        run: just build-services fast

      - name: Check staged installation
        run: just test-install fast

      - name: Layering and contract checks
        run: tools/test-integration.sh layering desktop_dbus_contract template_undo_signal install_layout

  # The job id and name keep the old crate name: branch protection may require this check by name.
  helix-shell-core:
    name: helix-shell-core (Rust)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: bash tools/ci/arch-helix-ci-deps.sh
      - name: Rust formatting
        run: |
          rustup component add rustfmt
          tools/rustfmt.sh --check
      - name: Unit tests
        run: |
          tools/verify_config_export_golden.sh
          cargo test -p helix-base -p helix-agent -p helix-config -p helix-config-export -p helix-models -p helix-compositor -p helix-shell-model -p helix-chat -p helix-software-model -p helix-monitor-model -p helix-wallpaper-model --quiet
      - name: helix-theme (C++ parity goldens)
        run: cargo test -p helix-theme --quiet
      - name: helix-desktop in-process theme tests
        run: cargo test -p helix-desktop in_process --quiet

  helix-desktop-agent:
    name: helix-desktop Agent Surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus dbus-x11 python3-gi gir1.2-gio-2.0 \
            libpipewire-0.3-dev libspa-0.2-dev
      - name: Agent integration (Rust desktop)
        run: ./tools/nested/helix-desktop-agent-integration.sh

  helix-desktop-config:
    name: helix-desktop Configuration1
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: bash tools/ci/arch-helix-ci-deps.sh dbus python python-gobject
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the Rust services
        run: cargo build --profile fast -p helix-desktop -p helix-assistant -p helix-inference
      - name: Configuration smoke (Rust desktop)
        env:
          HELIX_ASSETS_DIR: ${{ github.workspace }}/assets
        run: ./tools/nested/helix-desktop-config-smoke.sh
      - name: Rust Configuration1 contract
        run: ./tools/nested/helix-desktop-configuration-contract.sh
      # The Rust assistant against the Rust service and the Rust inference service (scripted replies).
      - name: Assistant integration (Rust assistant + desktop)
        run: tools/test-integration.sh assistant_integration
      # inference_service_integration (~100 s) runs under `just test` locally; on the CI container it was
      # SIGKILLed at ~85 s, so it is not a CI gate until that is understood. The crate is still compiled above.

  helix-desktop-audio-meter:
    name: helix-desktop Audio meter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus dbus-x11 python3-gi gir1.2-gio-2.0 pipewire wireplumber \
            libpipewire-0.3-dev libspa-0.2-dev
      - name: Input meter integration (Rust desktop)
        run: ./tools/nested/helix-desktop-audio-meter-integration.sh

  compositor:
    name: compositor (niri fork)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    # Informational until its first runs confirm the package list below; it is not a required check.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: bash tools/ci/arch-helix-ci-deps.sh libinput seatd libdisplay-info mesa
      - name: Clippy (warnings are errors)
        run: cargo clippy -p niri -p niri-config -p niri-ipc --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p niri -p niri-config -p niri-ipc
