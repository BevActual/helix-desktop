[package]
name = "helix-wallpaper"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Paints the desktop background on a Wayland layer surface. A separate small process, so its memory is not the shell's."

[dependencies]
wayland-client = { workspace = true }
wayland-protocols = { workspace = true, features = ["client", "staging"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
memmap2 = { workspace = true }
libc = { workspace = true }
helix-wallpaper-model = { workspace = true }

[lints]
workspace = true
