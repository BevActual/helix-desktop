[package]
name = "helix-image"
version = "0.1.0"
edition = "2021"
publish = false
description = "Local diffusion worker (one request per process)."

[[bin]]
name = "helix-image"
path = "src/main.rs"

[build-dependencies]
cc = "1"

[dependencies]
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
