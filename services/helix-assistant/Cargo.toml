[package]
name = "helix-assistant"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "helix-assistant: plain English in, one desktop action out. Port of C++ src/assistant/assistant_main.cpp."

[[bin]]
name = "helix-assistant"
path = "src/main.rs"

[dependencies]
helix-agent = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
zbus = { workspace = true, features = ["tokio"] }
futures-util = { workspace = true }

[lints]
workspace = true
