[package]
name = "helix-assistant"
version = "0.1.0"
edition = "2021"
publish = false
description = "helix-assistant: plain English in, one desktop action out. Port of C++ src/assistant/assistant_main.cpp."

[[bin]]
name = "helix-assistant"
path = "src/main.rs"

[dependencies]
helix-shell-core = { path = "../../core/helix-shell-core" }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
