[package]
name = "helix-nightlight"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Night light: warms the screen in the evening through the compositor's gamma-control protocol. A separate small process; it holds the gamma tables only while the screen is meant to be warm."

[dependencies]
helix-nightlight-model = { path = "../../core/helix-nightlight-model" }
wayland-client = { workspace = true }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
libc = { workspace = true }

