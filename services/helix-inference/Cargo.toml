[package]
name = "helix-inference"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "org.helix.Inference: sandboxed model service + worker bins (Rust)."

[[bin]]
name = "helix-inference"
path = "src/main.rs"

[[bin]]
name = "helix-transcribe"
path = "src/bin/helix-transcribe.rs"

[build-dependencies]
cc = { workspace = true }

[dependencies]
serde_json = { workspace = true }
base64 = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif", "bmp", "webp"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
zbus = { workspace = true, features = ["tokio"] }
futures-util = { workspace = true }
libc = { workspace = true }

[lints]
workspace = true
