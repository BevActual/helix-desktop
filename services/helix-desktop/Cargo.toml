[package]
name = "helix-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust org.helix.Desktop service (migrating from C++ helix-service). See docs/design/cpp-to-rust.md."

[[bin]]
name = "helix-desktop"
path = "src/main.rs"

[dependencies]
helix-shell-core = { path = "../../core/helix-shell-core" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
