[package]
name = "helix-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Rust org.helix.Desktop service (migrating from C++ helix-service). See docs/design/cpp-to-rust.md."

[[bin]]
name = "helix-desktop"
path = "src/main.rs"

[[bin]]
name = "helix-fake-bluez"
path = "src/bin/helix-fake-bluez.rs"

[dependencies]
helix-agent = { workspace = true }
helix-config = { workspace = true }
helix-config-export = { workspace = true }
helix-theme = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }
md5 = "0.7"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
zbus = { workspace = true, features = ["tokio", "blocking-api"] }
futures-util = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
pipewire = { version = "0.10", features = ["v0_3_33"] }

[dev-dependencies]
helix-desktop-api = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
zbus = { workspace = true, features = ["tokio"] }

[lints]
workspace = true
