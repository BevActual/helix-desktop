[package]
name = "helix-idle"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Locks the session and turns the screen off when nobody is there, using the compositor's idle protocol. A separate small process."

[dependencies]
wayland-client = { workspace = true }
wayland-protocols = { workspace = true, features = ["client", "staging"] }
zbus = { version = "5", features = ["blocking-api"] }
toml = { workspace = true }

[lints]
workspace = true
