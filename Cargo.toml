# Rust workspace for Helix Desktop (repo helix-desktop). Layout: core / shell / apps / services / dev.
[workspace]
resolver = "2"
members = [
    "core/helix-shell-core",
    "core/helix-desktop-api",
    "core/helix-theme",
    "services/helix-wallpaper",
    "services/helix-idle",
    "services/helix-desktop",
    "shell/helix-shell-tauri/src-tauri",
    "shell/helix-shell-strut",
    "greeter/helix-greeter-tauri/src-tauri",
    "apps/helix-settings/src-tauri",
    "apps/helix-mobius/src-tauri", # Mobius hub
    "apps/helix-software/src-tauri",
    "apps/helix-system-monitor/src-tauri",
    "dev/helix-attacker",
]
# compositor/ is its own Cargo workspace (GPL niri fork); keep it out of this one.
exclude = ["compositor"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# For iterating on the live desktop: links in seconds instead of minutes. Memory is measured with the release profile.
[profile.fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = false
