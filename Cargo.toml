# Rust workspace for Helix Desktop (repo helix-desktop). Layout: core / shell / apps / services / dev.
[workspace]
resolver = "2"
members = [
    "core/helix-agent",
    "core/helix-base",
    "core/helix-chat",
    "core/helix-compositor",
    "core/helix-config",
    "core/helix-config-export",
    "core/helix-models",
    "core/helix-task",
    "core/helix-monitor-model",
    "core/helix-shell-model",
    "core/helix-software-model",
    "core/helix-wallpaper-model",
    "core/helix-nightlight-model",
    "core/helix-desktop-api",
    "core/helix-acp",
    "core/helix-embed",
    "core/helix-knowledge",
    "core/helix-theme",
    "services/helix-wallpaper",
    "services/helix-idle",
    "services/helix-identify",
    "services/helix-lock",
    "services/helix-agent-input",
    "services/helix-nightlight",
    "services/helix-desktop",
    "services/helix-assistant",
    "services/helix-inference",
    "services/helix-agents",
    "services/helix-image",
    "services/helix-system-upgrade",
    "shell/helix-shell-tauri/src-tauri",
    "shell/helix-shell-strut",
    "greeter/helix-greeter-tauri/src-tauri",
    "apps/helix-settings/src-tauri",
    "apps/helix-mobius/src-tauri", # Mobius hub
    "apps/helix-software/src-tauri",
    "apps/helix-system-monitor/src-tauri",
    "apps/helix-models/src-tauri",
    "dev/helix-attacker",
    # The compositor (niri fork). niri-visual-tests needs GTK 4 and libadwaita; build recipes exclude it.
    "compositor",
    "compositor/niri-config",
    "compositor/niri-ipc",
    "compositor/niri-visual-tests",
]
# material-colors is vendored upstream code used as a path dependency. Excluded so that its dev-dependencies (examples:
# reqwest 0.13, a second image and tokio) are not resolved into our lockfile.
exclude = ["third_party/material-colors"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/BevActual/helix-desktop"

# One place for the versions every crate shares. A member adds its own features: `tokio = { workspace = true, features = [...] }`.
# Crates that differ on purpose say why next to their own line.
[workspace.dependencies]
helix-acp = { path = "core/helix-acp" }
helix-agent = { path = "core/helix-agent" }
helix-base = { path = "core/helix-base" }
helix-chat = { path = "core/helix-chat" }
helix-compositor = { path = "core/helix-compositor" }
helix-config = { path = "core/helix-config" }
helix-config-export = { path = "core/helix-config-export" }
helix-task = { path = "core/helix-task" }
helix-models = { path = "core/helix-models" }
helix-monitor-model = { path = "core/helix-monitor-model" }
helix-shell-model = { path = "core/helix-shell-model" }
helix-software-model = { path = "core/helix-software-model" }
helix-desktop-api = { path = "core/helix-desktop-api" }
helix-embed = { path = "core/helix-embed" }
helix-knowledge = { path = "core/helix-knowledge" }
helix-theme = { path = "core/helix-theme" }
helix-wallpaper = { path = "services/helix-wallpaper" }
helix-wallpaper-model = { path = "core/helix-wallpaper-model" }
helix-nightlight-model = { path = "core/helix-nightlight-model" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8"
regex = "1"
libc = "0.2"
base64 = "0.22"
futures-util = "0.3"
tokio = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
image = { version = "0.25", default-features = false }
tauri = "2"
tauri-build = "2"
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
memmap2 = "0.9"
cc = "1"
ureq = "3"

# Used by the compositor crates (compositor/, niri-config, niri-ipc, niri-visual-tests).
anyhow = "1.0.104"
bitflags = "2.13"
clap = { version = "4.6.6", features = ["derive"] }
insta = "1.48.0"
tracing = { version = "0.1.44", features = ["max_level_trace", "release_max_level_debug"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracy-client = { version = "0.18.5", default-features = false }
smithay = { git = "https://github.com/Smithay/smithay.git", rev = "22571baa20d34d71092942dbb520c4e3fbbd6263", default-features = false }
smithay-drm-extras = { git = "https://github.com/Smithay/smithay.git", rev = "22571baa20d34d71092942dbb520c4e3fbbd6263" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# For iterating on the live desktop: links in seconds instead of minutes. Memory is measured with the release profile.
[profile.fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = false

# The compositor is latency-sensitive, so its crates are built for speed (opt-level 3) with overflow checks, as niri's own release
# profile did. The Helix apps keep opt-level "s" above. `knuffel` (via niri-config) generates huge debuginfo, hence debug = false.
[profile.release.package.niri]
opt-level = 3
overflow-checks = true
[profile.release.package.niri-config]
opt-level = 3
overflow-checks = true
debug = false
[profile.release.package.niri-ipc]
opt-level = 3
[profile.release.package.smithay]
opt-level = 3
[profile.release.package.smithay-drm-extras]
opt-level = 3

[profile.dev.package.insta]
opt-level = 3
[profile.dev.package.similar]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
