[package]
name = "helix-system-monitor"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Helix System Monitor: Overview, Processes, Screen Time as a Tauri toplevel."

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
helix-monitor-model = { workspace = true }
helix-config = { workspace = true }
helix-desktop-api = { workspace = true }
gtk = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "macros", "rt-multi-thread"] }

[[bin]]
name = "helix-system-monitor"
path = "src/main.rs"

[lints]
workspace = true
