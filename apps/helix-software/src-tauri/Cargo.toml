[package]
name = "helix-software"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Helix Software: Flatpak / Fedora / firmware store as a Tauri toplevel."

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
helix-software-model = { workspace = true }
base64 = { workspace = true }
helix-desktop-api = { workspace = true }
gtk = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "macros", "rt-multi-thread", "process"] }

[[bin]]
name = "helix-software"
path = "src/main.rs"

[lints]
workspace = true
