[package]
name = "helix-software"
version = "0.1.0"
edition = "2021"
publish = false
description = "Helix Software: Flatpak / Fedora / firmware store as a Tauri toplevel."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
helix-shell-core = { path = "../../../core/helix-shell-core" }
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread", "process"] }

[[bin]]
name = "helix-software"
path = "src/main.rs"
