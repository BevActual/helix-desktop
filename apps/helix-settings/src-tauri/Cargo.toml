[package]
name = "helix-settings"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Helix Settings: its own Tauri application. The Agent Surface manager (who may do what), and the pages that grow around it."

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
helix-desktop-api = { workspace = true }
helix-agent = { workspace = true }
helix-base = { workspace = true }
helix-compositor = { workspace = true }
helix-config = { workspace = true }
helix-models = { workspace = true }
helix-wallpaper-model = { workspace = true }
helix-nightlight-model = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
base64 = { workspace = true }
gtk = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { workspace = true }
zbus = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["time", "sync"] }
ureq = { workspace = true }

[[bin]]
name = "helix-settings"
path = "src/main.rs"

[lints]
workspace = true
