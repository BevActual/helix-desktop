[package]
name = "helix-mobius"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Mobius: Helix’s desktop AI — conversations, personas, and model routing. Talks via org.helix.Inference; Act hands off to the bar."

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
helix-agent = { workspace = true }
helix-base = { workspace = true }
helix-chat = { workspace = true }
helix-compositor = { workspace = true }
helix-config = { workspace = true }
helix-desktop-api = { workspace = true }
helix-acp = { workspace = true }
helix-embed = { workspace = true }
helix-knowledge = { workspace = true }
gtk = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { workspace = true }
zbus = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["time", "sync", "macros", "fs", "io-util", "process", "rt-multi-thread", "net"] }
futures-util = { workspace = true }
toml = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = "3"
sha2 = "0.10"
libc = { workspace = true }
base64 = { workspace = true }
ring = "0.17"
scraper = "0.27"
roxmltree = "0.21"
url = "2"
image = { workspace = true, features = ["png", "jpeg", "gif", "bmp", "webp"] }
similar = "2"

[[bin]]
name = "helix-mobius"
path = "src/main.rs"

[lints]
workspace = true
