[package]
name = "helix-shell-tauri"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Helix shell surfaces on Tauri. A thin face over helix-shell-core and helix-desktop-api."

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
helix-desktop-api = { workspace = true }
helix-shell-core = { workspace = true }
gtk = { workspace = true }
gtk-layer-shell = { workspace = true, features = ["v0_6"] }
libc = { workspace = true }
# Tells the compositor which rectangles of the shell surface to blur (ext-background-effect-v1); see src/blur.rs.
wayland-client = { workspace = true }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { workspace = true, features = ["client", "staging"] }
gdkwayland-sys = "0.18"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
base64 = { workspace = true }
tauri = { workspace = true }
zbus = { workspace = true, features = ["tokio"] }
zbus_polkit = "5.1"
nix = { version = "0.29", features = ["user"] }
tokio = { workspace = true, features = ["macros", "time", "sync", "net", "io-util"] }
futures-util = { workspace = true }

[lints]
workspace = true
