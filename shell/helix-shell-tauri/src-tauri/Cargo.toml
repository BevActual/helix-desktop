[package]
name = "helix-shell-tauri"
version = "0.1.0"
edition = "2021"
publish = false
description = "Helix shell surfaces on Tauri. A thin face over helix-shell-core and helix-desktop-api."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
helix-desktop-api = { path = "../../../core/helix-desktop-api" }
helix-shell-core = { path = "../../../core/helix-shell-core" }
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
libc = "0.2"
# Tells the compositor which rectangles of the shell surface to blur (ext-background-effect-v1); see src/blur.rs.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
gdkwayland-sys = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri = { version = "2", features = [] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "time", "sync", "net", "io-util"] }
futures-util = { version = "0.3", default-features = false }
