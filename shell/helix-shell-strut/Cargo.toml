[package]
name = "helix-shell-strut"
version = "0.1.0"
edition = "2021"
publish = false
description = "Long-lived exclusive-zone holder for the Helix bar strip. Survives bar restarts so niri does not resize every window."

[dependencies]
helix-shell-core = { path = "../../core/helix-shell-core" }
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
