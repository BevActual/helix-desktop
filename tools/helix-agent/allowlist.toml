# Helix Agent Surface v1 — tools exposed over MCP.
# Dangerous session power actions and synthetic input stay off.

# How tool calls reach the desktop.
#   auto     use the desktop service's Agent Surface interface when it exists, else the direct `helix-panel` socket.
#            A refusal from Agent Surface is final and is never retried on the direct path.
#   surface  require Agent Surface (grants, confirmation and audit are enforced by the service). Set once installed:
#            if the service is down the tools report an error instead of quietly using the unguarded direct path.
#   agent1   alias for `surface` (legacy config name).
#   legacy   always use the direct socket (no per-client grants or confirmation).
[backend]
mode = "surface"

# Which risk tiers (protocols/ipc/msg-risk.toml) this adapter may ask for. "blocked" is never granted. The service still
# decides: you are asked the first time a tier is needed, and "confirm" actions ask each time. Remove a tier here to make
# the adapter refuse to even ask for it.
[grants]
tiers = ["observe", "observe-private", "act", "confirm"]

[tools]
desktop_status = true
desktop_capture = true
desktop_context = true
panel_toggle = true
panel_open = true
panel_close = true
settings_open = true
bar_visibility = true
clipboard_get = true
clipboard_set = true
notify = true
notifications_recent = true
workspace_step = true
workspaces_list = true
windows_list = true
window_focus = true
app_launch = true
window_close = true
dnd_toggle = true

# The actions catalogue (docs/design/actions.md): settings by what they do, recorded and undoable.
settings_find = true
settings_get = true
settings_set = true

# Computer use on the agent display (docs/design/computer-use.md): a separate screen for the agent's own programs.
computer_launch = true
computer_screenshot = true
computer_click = true
computer_move = true
computer_scroll = true
computer_key = true
computer_type = true
computer_state = true
computer_ask_for_help = true

