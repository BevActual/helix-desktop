# Layering rules for cpp/, checked by tools/check-layers.py (meson test `layering`).
#
# After retiring the C++ session UI, only base + platform + independent processes remain.

[layers]
base = ["util", "core", "i18n", "time"]
platform = ["config", "net", "security", "dbus", "system", "notification", "hooks", "auth", "debug", "idle", "wayland", "compositors"]

[independent]
# `desktop` C++ tree deleted (agent lives in Rust). Remaining independent: inference workers (+ apps/assistant stubs).
modules = ["apps", "assistant"]
may_include = ["base", "platform", "independent"]
