# Dependency-direction rules for the Cargo workspace, checked by tools/check-layers.py
# (`tools/test-integration.sh layering`). Keys are top-level directories; values are the directories a crate
# there may depend on (path dependencies inside this workspace). A crate may always depend on
# its own directory's siblings only where its own directory is listed.
#
# Mirrors the "Tree roles" table in docs/design/product-structure.md: pure models in core/, each
# process on its own, nothing reaching up into shell chrome, and the greeter on its own.

[rules]
core = ["core", "third_party"]
third_party = ["third_party"]
services = ["core", "third_party"]
shell = ["core", "third_party"]
apps = ["core", "third_party"]
greeter = ["third_party"]
dev = ["core", "services", "shell", "apps", "greeter", "third_party"]
