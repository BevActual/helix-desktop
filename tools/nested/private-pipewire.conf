# A PipeWire with two virtual sinks and a virtual microphone and nothing else: no session manager, no ALSA, no Bluetooth, so it can
# never open or disturb real audio hardware. Used by tools/nested/private-audio.sh.
context.properties = {
    core.daemon = true
    core.name   = pipewire-helix   # the socket name inside PIPEWIRE_RUNTIME_DIR; clients use PIPEWIRE_REMOTE=pipewire-helix
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { nice.level = -11 } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-access args = { } }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-link-factory }
]
context.objects = [
    { factory = adapter
      args = { factory.name = support.null-audio-sink node.name = helix-test-sink-1 node.description = "Helix Test Speakers"
               media.class = Audio/Sink object.linger = true audio.position = [ FL FR ] }
    }
    { factory = adapter
      args = { factory.name = support.null-audio-sink node.name = helix-test-sink-2 node.description = "Helix Test Headphones"
               media.class = Audio/Sink object.linger = true audio.position = [ FL FR ] }
    }
    { factory = adapter
      args = { factory.name = support.null-audio-sink node.name = helix-test-mic node.description = "Helix Test Microphone"
               media.class = Audio/Source/Virtual object.linger = true audio.position = [ FL FR ] }
    }
]
