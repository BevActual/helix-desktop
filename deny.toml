# cargo-deny policy: `cargo deny check`. Generated against the dependency tree of 2026-10-15; the licence list is every SPDX
# identifier that tree already uses, so a new licence shows up as a failure to review rather than slipping in.
[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
]
confidence-threshold = 0.9

[licenses.private]
# First-party crates are `publish = false`.
ignore = true

[bans]
# Several majors of one crate cost build time and binary size. Warn so each new duplicate is noticed; the known ones come from Tauri.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
